<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="የዐጸደ ትጉሃን ሰንበት ትምህርት ቤት እቅድ አስተዳደር እና መገናኛ ስርዓት — እቅዶች፣ ሪፖርቶች፣ ቀን መቁጠሪያ እና ይፋዊ ሰነዶች።">
  <meta name="theme-color" content="#7A1321">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ዐጸደ ትጉሃን">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ዐጸደ ትጉሃን ሰንበት ትምህርት ቤት</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Loading splash: shown while Flutter boots (~30s on slow connections),
       so the page never looks like a blank white screen. Removed on first frame. */
    html, body { margin: 0; padding: 0; height: 100%; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #7A1321; color: #ffffff; text-align: center;
      font-family: sans-serif; gap: 18px; padding: 24px; box-sizing: border-box;
    }
    #loading img { width: 96px; height: 96px; border-radius: 50%; border: 3px solid #D4AF37; }
    #loading h1 { font-size: 22px; margin: 0; font-weight: bold; }
    #loading p { font-size: 16px; margin: 0; opacity: 0.9; }
    #loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.3); border-top-color: #D4AF37;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="ዐጸደ ትጉሃን">
    <h1>ዐጸደ ትጉሃን ሰንበት ት/ቤት</h1>
    <div class="spinner"></div>
    <p>በመጫን ላይ… እባክዎ ትንሽ ይጠብቁ</p>
  </div>
  <script>
    // Remove the loading splash as soon as Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: Hourly plan reminders
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduler
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s --max-time 120 -o /tmp/sched.json -w "%{http_code}" -X POST -H "X-Bot-Proxy-Secret: ${{ secrets.BOT_PROXY_SECRET }}" -H "Content-Type: application/json" -d '{}' https://plan-atsede-teguhan-new.onrender.com/api/scheduler/run)
            echo "attempt $i: HTTP $code"
            cat /tmp/sched.json; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 60
          done
          exit 1

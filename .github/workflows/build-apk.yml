# Build the Android release APK and publish it as a GitHub Release.
#
# The APK is built with the live PHP API as its server address
# (https://plan-atsede-php-api.onrender.com — bare URL, no /api suffix),
# so the app can log in and load plans without any setup on the phone.
# It is debug-signed (see android/app/build.gradle.kts): installable by
# sideloading on a phone, NOT for the Play Store.
#
# Trigger: every push to main that touches the app code, or manually
# from the Actions tab (Run workflow).
name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Diagnose keystore secret (temporary)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "len=${#ANDROID_KEYSTORE_BASE64}"
          echo "mod4=$(( ${#ANDROID_KEYSTORE_BASE64} % 4 ))"
          echo "newlines=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd '\n' | wc -c)"
          echo "spaces=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd ' ' | wc -c)"
          echo "invalid=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d 'A-Za-z0-9+/=' | wc -c)"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/test.p12 && echo "decode_ok size=$(stat -c%s /tmp/test.p12)" || echo "decode_fail"
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.p12
      - name: Build release APK
        env:
          KEYSTORE_PATH: upload-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define API_BASE_URL=https://plan-atsede-php-api.onrender.com
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-atsede-teguhan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK build ${{ github.run_number }}
          body: |
            Release APK built from main (${{ github.sha }}).
            Server: https://plan-atsede-php-api.onrender.com
            Download app-release.apk on the phone, tap it and install.
          files: build/app/outputs/flutter-apk/app-release.apk

# Keep the free Render services warm so the app never waits on a cold start.
#
# Render free services sleep after 15 minutes idle. Waking the PHP Docker
# container took ~4.5 minutes on 2026-11-25, while the app's login waited
# only 10 seconds -- so the first login of the day always failed with a
# TimeoutException. Pinging every 10 minutes keeps both services awake.
# The scheduler ping also touches the database, keeping the TiDB path warm
# (the first DB connection after idle was slow too).
#
# Trigger: every 10 minutes, or manually from the Actions tab.
#
# NOTE (2026-11-26): this file was INVALID YAML from creation -- the scheduler
# step used a single-line `run:` with `-H "X-Bot-Proxy-Secret: ..."` and the
# ": " inside broke YAML parsing, so GitHub never ran it (every push created
# a failed "Invalid workflow file" run and the cron never fired). All `run:`
# commands now use block scalars (`run: |`) and retry, so a cold Render
# service (wake ~4.5 min) still gets warmed.
name: Keep services warm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    name: Ping Render services
    runs-on: ubuntu-latest
    steps:
      - name: Ping PHP API health (no DB)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 https://plan-atsede-php-api.onrender.com/health.php && exit 0
            sleep 45
          done
          exit 1
      - name: Ping scheduler due list (warms DB path)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 "https://plan-atsede-php-api.onrender.com/scheduler.php?action=due" -H "X-Bot-Proxy-Secret: ${{ secrets.BOT_PROXY_SECRET }}" && exit 0
            sleep 45
          done
          exit 1
      - name: Ping bot service
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 https://plan-atsede-teguhan-new.onrender.com/ && exit 0
            sleep 45
          done
          exit 1

services:
  - type: web
    name: atsede-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_server.py
    envVars:
      - key: BOT_TOKEN
        sync: false # Set securely in Render Dashboard (Never put secret tokens in repository)
      - key: CHAT_ID
        sync: false
      - key: PORT
        value: 10000
      - key: PHP_API_BASE
        sync: false
